<!doctype html>
<html lang="en">
  <head>
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/bookbridge/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BookBridge - Peer-to-peer campus marketplace for students to buy and sell textbooks." />
    <title>BookBridge</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
